name: Temporary formal formatter path edit
on:
  pull_request:
    paths:
      - .github/workflows/formatter-path-edit.yaml
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit
      - name: Apply four scoped source wrappers
        run: |
          set -euo pipefail
          mkdir -p .calcit/path-edit
          git hash-object calcit.cirru > .calcit/path-edit/before-blob.txt
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const run=(...args)=>JSON.parse(execFileSync('calcit',['calcit.cirru',...args,'--format','json'],{encoding:'utf8'}));
          const operations=[];
          const preview=run('query','def','app.comp.container/comp-previewer').data.code;
          function scan(node,path=[]){
            if(!Array.isArray(node))return;
            if(node[0]==='when' && JSON.stringify(node[1])===JSON.stringify(['not',['blank?','text']])){
              if(![':pick',':drop'].includes(node[2]?.[1]?.[1]))throw Error('Unexpected path callback');
              const wrapper=['try','self',['fn',['message'],['d!',['::',':data',['{}',[':data',[':data','store']],[':error','message']]]]]];
              operations.push(['tree','wrap','app.comp.container/comp-previewer','--path','@'+path.join('.'),'--input-format','json-ast','--code',JSON.stringify(wrapper)]);
            }
            node.forEach((child,i)=>scan(child,[...path,i]));
          }
          scan(preview);
          if(operations.length!==2)throw Error('Expected exactly two path callbacks');
          const updater=run('query','def','app.updater/updater').data.code;
          if(updater[3]?.[0]!=='match')throw Error('Unexpected updater shape');
          for(const tag of [':pick',':drop']){
            const indexes=updater[3].flatMap((branch,i)=>branch?.[0]?.[0]===tag?[i]:[]);
            if(indexes.length!==1)throw Error('Expected unique '+tag);
            const index=indexes[0];
            if(updater[3][index][1]?.[0]!=='update')throw Error('Unexpected updater branch');
            operations.push(['tree','wrap','app.updater/updater','--path',`@3.${index}.1`,'--input-format','json-ast','--code',JSON.stringify(['assoc','self',':error',['Option',':none']])]);
          }
          const code=JSON.stringify(operations);
          const dry=run('edit','transaction','--code',code,'--dry-run');
          if(!dry.scoped_revision)throw Error('Missing scoped revision');
          const applied=run('edit','transaction','--code',code,'--expect-revision',dry.scoped_revision);
          writeFileSync('.calcit/path-edit/report.json',JSON.stringify({operations,dry,applied},null,2));
          NODE
          cp calcit.cirru .calcit/path-edit/calcit.cirru
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: formatter-path-edit
          path: .calcit/path-edit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
