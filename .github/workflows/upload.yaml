name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable Corepack and Yarn Berry
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-cr@0.0.9

    - name: Install deps
      run: caps --ci && yarn install --immutable

    - name: Validate Calcit snapshot and types
      run: |
        cr calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        # hard gate: preprocessing must be warning-free
        cr calcit.cirru --check-only
        # advisory: dynamic method calls cannot be monomorphized.
        # All current hits live in external modules (respo/reel/respo-alerts)
        # or documented JS FFI / alerts-plugin boundaries, so it is not a gate here.
        cr calcit.cirru --warn-dyn-method --check-only || true
        mkdir -p .calcit/upgrade
        cr calcit.cirru analyze check-types --summary-only --format json > .calcit/upgrade/check-types.json
        cr calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic,code-nil --intent unresolved,declared-optional --summary-only --format json > .calcit/upgrade/weak-types.json
        cr calcit.cirru analyze deprecated --summary-only --format json > .calcit/upgrade/deprecated.json
        node scripts/check-calcit-upgrade-baseline.mjs

    - name: Compiles to JS
      run: >
        cr calcit.cirru js && yarn vite build --base=./

    - name: Deploy to server
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      run: echo "${{ steps.deploy.outputs.status }}"
